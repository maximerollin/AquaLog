project_id = "aqualog-ticket-10"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = false
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:55321"
additional_redirect_urls = ["aqualog://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 55327

[functions.migrate-initial-copy]
enabled = true
verify_jwt = true
entrypoint = "./functions/migrate-initial-copy/index.ts"
